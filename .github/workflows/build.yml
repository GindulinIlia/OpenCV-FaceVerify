name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Check main.py
      run: |
        if [ ! -f "main.py" ]; then
          echo "ERROR: main.py not found! Rename your file to exactly 'main.py'"
          exit 1
        fi

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk python3-dev autoconf automake libtool libtool-bin pkg-config m4 zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
        
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36
        
    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = University
        package.name = university
        package.domain = org.sgu
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,json
        version = 0.1
        requirements = python3,kivy==2.3.0
        orientation = portrait
        fullscreen = 0
        android.archs = arm64-v8a
        android.api = 33
        android.minapi = 21
        android.ndk = 27b
        android.accept_sdk_license = True

        [buildozer]
        log_level = 2
        warn_on_root = 1
        p4a.branch = master
        EOF
        
    - name: Build APK
      run: |
        buildozer -v android debug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: university-apk
        path: bin/*.apk
