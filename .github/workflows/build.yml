name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Check main.py
      run: |
        if [ ! -f "main.py" ]; then
          echo "ERROR: main.py not found! Please rename your file to exactly 'main.py'"
          exit 1
        fi

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'  # 3.10 — золотой стандарт стабильности для Kivy Android
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk python3-dev autoconf automake libtool libtool-bin pkg-config m4 zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
        
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.33
        
    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = University
        package.name = university
        package.domain = org.sgu
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,json
        version = 0.1
        requirements = python3,kivy==2.2.1
        orientation = portrait
        fullscreen = 0
        android.archs = arm64-v8a
        android.api = 33
        android.minapi = 21
        android.ndk = 25b
        android.accept_sdk_license = True

        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF
        
    - name: Build APK
      run: |
        echo "🧹 Очистка кэша..."
        rm -rf .buildozer bin
        
        echo "🚀 Запуск сборки..."
        set +e
        buildozer -v android debug > build_full_log.txt 2>&1
        EXIT_CODE=$?
        set -e
        
        if [ $EXIT_CODE -eq 0 ]; then
          echo "✅ Сборка прошла успешно!"
        else
          echo "========================================="
          echo "🚨 Ключевые строки с ошибкой:"
          echo "========================================="
          grep -i -E "error|exception|fatal|failed|traceback" build_full_log.txt | tail -n 30 || echo "Не найдено"
          echo "========================================="
          echo "🚨 Последние 50 строк лога:"
          echo "========================================="
          tail -n 50 build_full_log.txt
          exit 1
        fi
        
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: university-apk
        path: bin/*.apk

    - name: Upload Full Log (если была ошибка)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-full-log
        path: build_full_log.txt
